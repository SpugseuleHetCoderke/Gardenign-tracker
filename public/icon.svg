<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6ec"/>
      <stop offset="1" stop-color="#f6e6d0"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c6c46"/>
      <stop offset="1" stop-color="#69452a"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0904f"/>
      <stop offset="1" stop-color="#b04c1a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#2f6b2c"/>
      <stop offset="1" stop-color="#67b357"/>
    </linearGradient>
    <linearGradient id="hair" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffa04a"/>
      <stop offset="0.4" stop-color="#f0701f"/>
      <stop offset="1" stop-color="#a83a0c"/>
    </linearGradient>
    <linearGradient id="hairShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc182" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffc182" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9d6b1"/>
      <stop offset="1" stop-color="#e0a476"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93b6ca"/>
      <stop offset="1" stop-color="#4f7791"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="64" height="64" rx="14.08"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
  <rect width="64" height="64" fill="url(#bg)"/>

  <g transform="translate(2.88, -1.4880000000000004)">
    <!-- Ground. Extends well past the bottom edge so lifting the scene can't
         expose a gap underneath; the overflow is clipped by #frame. -->
    <path d="M -5.82 48.34 C 17.47 46.88, 40.77 46.88, 64.06 48.34
             L 64.06 78.62 L -5.82 78.62 Z" fill="url(#soil)"/>

    <!-- Potted plant -->
    <g>
      <path d="M 13.98 40.77 C 8.74 36.11, 7.57 29.12, 9.90 25.63
               C 12.81 28.54, 14.56 34.94, 14.56 40.77 Z" fill="url(#leaf)"/>
      <path d="M 15.14 40.77 C 20.38 36.11, 21.55 29.12, 19.22 25.63
               C 16.31 28.54, 14.56 34.94, 14.56 40.77 Z" fill="url(#leaf)"/>
      <path d="M 14.56 40.77 C 11.65 33.78, 12.23 25.63, 14.56 21.55
               C 16.89 25.63, 17.47 33.78, 14.56 40.77 Z" fill="url(#leaf)"/>
      <path d="M 14.56 23.30 L 14.56 40.77"
            stroke="#255c22" stroke-width="0.47" stroke-linecap="round" opacity="0.5"/>

      <path d="M 9.03 40.77 L 20.09 40.77
               C 19.51 46.01, 18.64 49.21, 17.47 49.50
               L 11.65 49.50
               C 10.48 49.21, 9.61 46.01, 9.03 40.77 Z" fill="url(#pot)"/>
      <rect x="8.44" y="39.31" width="12.23" height="2.62"
            rx="1.16" fill="#c9581d"/>
      <path d="M 11.65 41.93 C 11.36 45.43, 11.65 47.76, 12.23 49.21"
            stroke="#ffb583" stroke-width="0.70" stroke-linecap="round" opacity="0.5" fill="none"/>
    </g>

    <!-- Long hair, drawn behind the body -->
    <path d="M 34.94 13.10
             C 42.81 13.10, 46.88 18.35, 46.59 24.46
             C 48.63 30.28, 51.13 36.69, 50.55 42.52
             C 49.97 46.59, 48.46 49.39, 46.59 50.20
             C 45.89 44.26, 44.09 38.15, 42.28 33.49
             C 40.77 29.12, 39.14 25.04, 38.15 23.00
             C 34.94 20.09, 31.92 17.76, 31.62 16.60
             C 32.21 14.73, 33.43 13.10, 34.94 13.10 Z"
          fill="url(#hair)"/>

    <!-- Neck, tucked behind the dress -->
    <path d="M 33.66 24.17 L 36.98 24.17
             L 37.56 29.12 L 33.49 29.12 Z" fill="#dfa273"/>

    <!-- Dress -->
    <path d="M 34.94 26.21
             C 39.60 26.21, 41.93 29.12, 42.81 33.78
             C 43.97 39.60, 45.14 45.43, 45.43 48.92
             L 29.12 48.92
             C 29.41 43.10, 30.87 34.94, 32.91 29.12
             C 33.49 27.37, 34.07 26.21, 34.94 26.21 Z"
          fill="url(#dress)"/>

    <!-- Arm reaching toward the plant -->
    <path d="M 34.94 29.12
             C 31.45 32.03, 27.37 35.53, 23.30 38.15"
          stroke="url(#skin)" stroke-width="3.20" stroke-linecap="round" fill="none"/>
    <circle cx="22.42" cy="38.73" r="1.92" fill="url(#skin)"/>

    <!-- Head: profile facing the plant -->
    <path d="M 34.94 14.27
             C 31.74 14.56, 29.99 17.47, 30.17 20.09
             C 29.12 21.26, 28.95 22.01, 29.59 22.31
             C 30.05 22.54, 30.05 23.30, 30.40 23.76
             C 30.75 24.93, 31.74 26.03, 33.49 26.21
             C 36.98 26.50, 39.60 24.75, 40.19 21.84
             C 40.77 18.05, 38.73 14.56, 34.94 14.27 Z"
          fill="url(#skin)"/>

    <!-- Fringe sweeping over the forehead -->
    <path d="M 34.94 13.69
             C 38.44 13.86, 40.77 16.60, 40.48 20.09
             C 38.44 18.35, 34.94 17.47, 31.74 18.35
             C 30.98 17.47, 30.87 16.02, 31.74 15.03
             C 32.61 14.09, 33.78 13.69, 34.94 13.69 Z"
          fill="url(#hair)"/>

    <!-- A strand falling forward over the shoulder -->
    <path d="M 38.61 23.30
             C 40.77 26.79, 41.64 32.03, 41.47 36.69
             C 41.35 39.60, 40.77 41.35, 40.07 42.11
             C 39.78 37.86, 39.02 32.61, 37.86 28.54
             C 37.27 26.21, 37.56 24.46, 38.61 23.30 Z"
          fill="url(#hair)"/>

    <!-- Hair highlight -->
    <path d="M 38.44 15.43
             C 42.22 17.76, 43.97 24.46, 45.54 30.58
             C 47.06 36.69, 48.22 42.52, 47.87 47.17
             C 46.30 42.22, 44.38 34.94, 42.63 28.83
             C 41.12 23.00, 39.49 17.76, 38.44 15.43 Z"
          fill="url(#hairShine)"/>

    <!-- Eye -->
    <circle cx="32.50" cy="20.68" r="0.64" fill="#5c3a24"/>
  </g>
  </g>
</svg>